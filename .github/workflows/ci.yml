name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  orchestrator-tests:
    name: Orchestrator tests (vitest)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/orchestrator/package-lock.json
      - name: Install dependencies
        working-directory: desktop/orchestrator
        run: npm ci
      - name: Run tests
        working-directory: desktop/orchestrator
        run: npm test

  # Boots Hermes at the pinned ref with all Verso runtime patches applied and
  # requires a streaming /v1/responses to answer 200 + SSE — the same check
  # scripts/smoke-test-hermes-bundle.sh runs against the macOS bundle, minus
  # the bundled interpreter. Catches the failure class that shipped in 1.0.15:
  # a regenerated patch that applies cleanly and byte-compiles but lands on
  # the wrong call site and crashes every chat request at runtime.
  hermes-runtime-smoke:
    name: Hermes runtime smoke (patched gateway boots + streams)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read Hermes pin from build script
        id: pin
        run: |
          ref="$(grep -E '^HERMES_REF="' scripts/build-runtime-bundles.sh | cut -d'"' -f2)"
          repo="$(grep -E '^HERMES_REPO="' scripts/build-runtime-bundles.sh | cut -d'"' -f2)"
          extras="$(grep -E '^HERMES_EXTRAS="' scripts/build-runtime-bundles.sh | cut -d'"' -f2)"
          pins="$(grep -E '^HERMES_EXTRA_PINS=' scripts/build-runtime-bundles.sh | sed 's/.*(\(.*\)).*/\1/' | tr -d '"')"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "repo=${repo}" >> "$GITHUB_OUTPUT"
          echo "extras=${extras}" >> "$GITHUB_OUTPUT"
          echo "pins=${pins}" >> "$GITHUB_OUTPUT"
          echo "pinned: ${repo} @ ${ref} extras=[${extras}] pins=[${pins}]"

      - name: Fetch Hermes at pinned ref
        run: |
          mkdir hermes-src && cd hermes-src
          git init -q
          git remote add origin "${{ steps.pin.outputs.repo }}"
          git fetch -q --depth 1 origin "${{ steps.pin.outputs.ref }}"
          git checkout -q FETCH_HEAD

      - name: Apply Verso runtime patches (build order)
        run: |
          cd hermes-src
          for f in $(ls ../desktop/runtime-patches/hermes-agent/*.patch | LC_ALL=C sort); do
            echo "== applying $(basename "$f")"
            patch -p1 --batch < "$f"
          done

      - name: Install patched Hermes
        run: |
          pip install -q "./hermes-src[${{ steps.pin.outputs.extras }}]" ${{ steps.pin.outputs.pins }}
          hermes --version || true

      - name: Boot gateway and smoke a streaming /v1/responses
        run: |
          set -euo pipefail
          export HERMES_HOME="$RUNNER_TEMP/hermes-home"
          mkdir -p "$HERMES_HOME/memories"
          cp hermes-src/cli-config.yaml.example "$HERMES_HOME/config.yaml"
          export API_SERVER_ENABLED=true API_SERVER_HOST=127.0.0.1 API_SERVER_PORT=18977
          export API_SERVER_KEY="$(openssl rand -hex 32)"
          export PYTHONUNBUFFERED=1

          hermes gateway run > "$RUNNER_TEMP/gateway.log" 2>&1 &
          GW=$!

          deadline=$(( $(date +%s) + 120 ))
          until curl -sf -o /dev/null -H "Authorization: Bearer $API_SERVER_KEY" "http://127.0.0.1:18977/v1/models"; do
            if ! kill -0 "$GW" 2>/dev/null; then
              echo "::error::gateway died during startup"
              tail -40 "$RUNNER_TEMP/gateway.log"
              exit 1
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::gateway not ready within 120s"
              tail -40 "$RUNNER_TEMP/gateway.log"
              exit 1
            fi
            sleep 2
          done

          body='{"input":"smoke test","conversation":"ci-smoke-1","truncation":"auto","stream":true,"store":true,"model":"gpt-5.5","reasoning":{"effort":"low"}}'
          status="$(curl -s -N --max-time 60 -o response.txt -w "%{http_code}" \
            -X POST "http://127.0.0.1:18977/v1/responses" \
            -H "Authorization: Bearer $API_SERVER_KEY" \
            -H "Content-Type: application/json" \
            -H "Accept: text/event-stream" \
            -d "$body")"

          kill "$GW" 2>/dev/null || true

          if [ "$status" != "200" ]; then
            echo "::error::/v1/responses returned HTTP $status (expected 200 + SSE)"
            head -5 response.txt
            echo "---- errors.log ----"
            tail -40 "$HERMES_HOME/logs/errors.log" 2>/dev/null || tail -40 "$RUNNER_TEMP/gateway.log"
            exit 1
          fi
          if ! grep -q "^event: " response.txt; then
            echo "::error::HTTP 200 but no SSE events in response"
            head -5 response.txt
            exit 1
          fi
          if ! grep -Eq "^event: response\.(completed|failed)" response.txt; then
            echo "::error::SSE stream never reached a terminal event"
            grep "^event: " response.txt
            exit 1
          fi
          terminal="$(grep -Eo '^event: response\.(completed|failed)' response.txt | tail -1)"
          echo "PASS: HTTP 200, SSE stream terminated with ${terminal#event: }"
          echo "(response.failed is expected — CI has no model credentials; the handler is healthy either way)"
